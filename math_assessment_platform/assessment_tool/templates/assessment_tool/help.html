{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<style>
    .help-page { max-width: 820px; margin: 0 auto; }
    .help-search-row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
    .help-search-row input[type="search"] {
        flex: 1 1 240px; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px;
        box-sizing: border-box; font-size: 1rem;
    }
    .help-active-tag {
        display: inline-flex; align-items: center; gap: 0.4rem;
        background: #e0f2fe; color: #075985; padding: 6px 10px; border-radius: 999px;
        font-size: 0.85rem; font-weight: 600;
    }
    .help-active-tag[hidden] { display: none !important; }
    .help-active-tag a { color: #0c4a6e; text-decoration: none; }
    .help-status { color: #64748b; font-size: 0.9rem; min-height: 1.25rem; margin-bottom: 0.75rem; }
    .help-results { list-style: none; padding: 0; margin: 0; }
    .help-results li {
        border: 1px solid #e2e8f0; border-radius: 8px; padding: 0.9rem 1rem;
        margin-bottom: 0.65rem; background: #fff;
    }
    .help-results li:hover { border-color: #93c5fd; background: #f8fafc; }
    .help-card-header {
        display: flex; align-items: flex-start; justify-content: space-between;
        gap: 0.75rem; flex-wrap: wrap;
    }
    .help-results a.help-title-link {
        color: #1e293b; font-weight: 700; font-size: 1.05rem; text-decoration: none;
        flex: 1 1 auto;
    }
    .help-results a.help-title-link:hover { color: #2563eb; }
    .help-restriction-label {
        flex: 0 0 auto;
        font-size: 0.75rem; font-weight: 600; color: #475569;
        background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 999px;
        padding: 2px 8px; white-space: nowrap;
    }
    .help-tag-list { margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .help-tag {
        display: inline-block; padding: 2px 8px; border-radius: 999px;
        background: #f1f5f9; color: #334155; font-size: 0.78rem; text-decoration: none;
        border: 1px solid #e2e8f0;
    }
    .help-tag.is-matched, .help-tag.is-active {
        background: #dbeafe; border-color: #93c5fd; color: #1d4ed8; font-weight: 600;
    }
    .help-empty { color: #64748b; padding: 1.5rem 0; }
    .help-pagination {
        display: flex; gap: 0.5rem; align-items: center; justify-content: center;
        margin-top: 1.25rem; flex-wrap: wrap;
    }
    .help-pagination button {
        padding: 6px 12px; border-radius: 6px; border: 1px solid #cbd5e1;
        background: #fff; color: #1e293b; cursor: pointer; font-weight: 600;
    }
    .help-pagination button:hover:not(:disabled) { background: #f8fafc; color: #1e293b; }
    .help-pagination button:disabled { opacity: 0.45; cursor: default; }
    .help-pagination .page-info { color: #64748b; font-size: 0.9rem; }
</style>
{% endblock %}

{% block content %}
<div class="help-page"
     id="help-page"
     data-search-url="{{ search_api_url }}"
     data-initial-tag="{{ initial_tag|escape }}"
     data-initial-q="{{ initial_q|escape }}">
    <h1 style="margin-top: 0;">Q&amp;A</h1>
    <p style="color: #64748b; margin-top: 0;">
        Browse common questions and how-to articles. Results are filtered for your account type.
    </p>

    <div class="help-search-row">
        <input type="search" id="help-search-input" placeholder="Search tags, titles, and content…"
               autocomplete="off" aria-label="Search Q&A articles">
        <span id="help-active-tag" class="help-active-tag" hidden></span>
    </div>
    <div class="help-status" id="help-status" aria-live="polite"></div>
    <ul class="help-results" id="help-results"></ul>
    <div class="help-pagination" id="help-pagination" hidden>
        <button type="button" id="help-prev">Previous</button>
        <span class="page-info" id="help-page-info"></span>
        <button type="button" id="help-next">Next</button>
    </div>
</div>
{% endblock %}

{% block extra_js %}
{{ block.super }}
<script src="{% static 'assessment_tool/js/help_search.js' %}"></script>
{% endblock %}
