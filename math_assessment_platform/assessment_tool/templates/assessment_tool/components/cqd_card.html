{% load static %}
{% with pool_count=cqd.get_problem_pool_count display_name=cqd.get_display_name %}
<div class="cqd-item-row" data-id="{{ cqd.id }}" data-cqd-id="{{ cqd.id }}" data-branch-id="{{ cqd.assigned_folder.id }}" style="background: #f8fafc; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.02); border-left: 4px solid #3b82f6;">
    <div class="cqd-identity-block" style="display: flex; align-items: center; gap: 10px; flex-grow: 1; min-width: 0; margin-right: 4px;">
        <button type="button" class="btn-open-cqd-overlay" title="Open problem set" style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: none; background: transparent; padding: 0; cursor: pointer; flex-shrink: 0; border-radius: 4px;">
            <i class="fas fa-folder-open" style="color: #3b82f6; font-size: 0.95rem;"></i>
        </button>

        <input
            type="text"
            class="cqd-name-input"
            value="{{ display_name }}"
            data-previous="{{ display_name }}"
            placeholder="Problem set name"
            title="Problem set name"
        >

        <span class="cqd-pool-count" title="Problems currently in this set">
            <span class="cqd-pool-count-number">{{ pool_count }}</span>
            <span class="cqd-pool-count-label">{% if pool_count == 1 %}problem{% else %}problems{% endif %}</span>
        </span>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; flex-shrink: 0;">
        <div class="cqd-count-indicator cqd-clickable-count" data-cqd-id="{{ cqd.id }}" style="font-size: 0.75rem; background: #eff6ff; border: 1px solid #bfdbfe; padding: 2px 8px; border-radius: 20px; color: #1e40af; font-weight: 600; cursor: pointer; transition: background 0.15s ease;" onmouseover="this.style.background='#dbeafe'" onmouseout="this.style.background='#eff6ff'">
            Randomly chooses <span class="count-number-display">{{ cqd.suggested_count }}</span> from problem group
        </div>

        <button class="btn-delete-item" data-type="question_selection" title="Delete Problem Group" style="cursor: pointer; background: none; border: none; color: #94a3b8; transition: color 0.15s ease; padding: 2px 6px;">
            <i class="fas fa-trash"></i>
        </button>
    </div>
</div>
{% endwith %}
