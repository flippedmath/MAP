{% load static %}
<div class="cqd-item-row" data-cqd-id="{{ cqd.id }}" data-branch-id="{{ cqd.assigned_folder.id }}" style="background: #f8fafc; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 2px rgba(0,0,0,0.02); border-left: 4px solid #3b82f6;">
    <div style="display: flex; align-items: center; gap: 10px; flex-grow: 1; margin-right: 16px;">
        <i class="fas fa-folder-open" style="color: #3b82f6; font-size: 0.95rem;"></i>
        
        <span class="cqd-display-identity" style="font-weight: 600; color: #334155; font-size: 0.9rem;">
            {% if unique_name_override %}{{ unique_name_override }}{% else %}{{ cqd.get_display_name }}{% endif %}
        </span>
    </div>
    
    <div style="display: flex; align-items: center; gap: 12px;">
        <div class="cqd-count-indicator" style="font-size: 0.75rem; background: #eff6ff; border: 1px solid #bfdbfe; padding: 2px 8px; border-radius: 20px; color: #1e40af; font-weight: 600;">
            Randomly chooses {{ cqd.suggested_count }} from problem group
        </div>
        <button class="btn-delete-problem" data-type="question_selection" style="cursor: pointer; background: none; border: none; color: #94a3b8; transition: color 0.15s ease;"><i class="fas fa-trash"></i></button>
    </div>
</div>
