<div class="course-layout-container">
    <aside class="course-sidebar">
        <div class="sidebar-header">
            <h3>{{ course.name }}</h3>
            <span class="course-code">{{ course.code|default:"MT-101" }}</span>
        </div>
        
        <nav class="sidebar-nav">
            <a href="?tab=introduction" class="nav-item {% if active_tab == 'introduction' %}active{% endif %}">
                <span class="nav-icon">📖</span> Introduction
            </a>
            <a href="#" class="nav-item {% if active_tab == 'assessments' %}active{% endif %} disabled-placeholder">
                <span class="nav-icon">📝</span> Assessments
            </a>
            <a href="#" class="nav-item {% if active_tab == 'settings' %}active{% endif %} disabled-placeholder">
                <span class="nav-icon">⚙️</span> Course Settings
            </a>
            <a href="#" class="nav-item {% if active_tab == 'management' %}active{% endif %} disabled-placeholder">
                <span class="nav-icon">📊</span> Course Management
            </a>
        </nav>
    </aside>

    <main class="course-content-pane">
        {% block course_sub_content %}{% endblock %}
    </main>
</div>
