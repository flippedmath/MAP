<div id="problem-workspace-overlay" style="display: none; position: fixed; top: 20px; left: 20px; right: 20px; bottom: 20px; background: #ffffff; border-radius: 12px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); border: 1px solid #cbd5e1; z-index: 10000; flex-direction: column; overflow: hidden;" data-current-problem-id="">

                    <button id="add-input-trigger" style="background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; font-weight: 600; cursor: pointer;"><i class="fas fa-plus"></i> Add</button>
