/* -------------------------------------------------------------
 * Dynamic Workspace Info Tooltip Overlays
 * ------------------------------------------------------------- */
.workspace-info-tooltip-container .workspace-info-tooltip-overlay {
    visibility: hidden;
    position: absolute;
    z-index: 50;
    bottom: 125%; /* Positions the overlay box directly above the info icon */
    right: 0;
    width: 260px;
    background-color: #1e293b; /* Dark slate look matching design system rules */
    color: #ffffff;
    font-size: 0.75rem;
    line-height: 1.35;
    font-weight: 400;
    padding: 8px 12px;
    border-radius: 6px;
    box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    opacity: 0;
    transition: opacity 0.2s ease-in-out, transform 0.2s ease-in-out;
    transform: translateY(4px);
    pointer-events: none; /* Prevents overlay flickering when mouse enters bounds */
}

/* Tooltip Little Indicator Down Arrow triangle pointer */
.workspace-info-tooltip-container .workspace-info-tooltip-overlay::after {
    content: "";
    position: absolute;
    top: 100%;
    right: 8px;
    margin-left: -5px;
    border-width: 5px;
    border-style: solid;
    border-color: #1e293b transparent transparent transparent;
}

/* 🎯 Activate visibility instantly on hover trigger matches */
.workspace-info-tooltip-container:hover .workspace-info-tooltip-overlay {
    visibility: visible;
    opacity: 1;
    transform: translateY(0);
}
</style>
