<div class="problem-item-row" data-problem-id="{{ prob.id }}" data-branch-id="{{ prob.branch_location.id }}" style="background: #ffffff; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 2px rgba(0,0,0,0.02);">
    <div style="display: flex; align-items: center; gap: 8px; flex-grow: 1; margin-right: 16px;">
        <input type="text" 
               class="problem-title-input" 
               value="{{ prob.title }}" 
               data-previous="{{ prob.title }}" 
               placeholder="Enter problem title..."
               style="font-weight: 500; color: #334155; border: 1px solid transparent; background: transparent; padding: 2px 6px; border-radius: 4px; font-size: 0.9rem; width: 100%; outline: none; transition: all 0.15s ease;">
        
        <span class="problem-save-status" style="display: none; color: #10b981; font-size: 0.75rem; font-weight: 600; white-space: nowrap;"><i class="fas fa-check"></i> Saved</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
        <span class="problem-status-badge" style="font-size: 0.75rem; background: #f1f5f9; padding: 2px 6px; border-radius: 4px; color: #64748b; font-weight: 600; text-transform: uppercase;">{{ prob.problem_status }}</span>
    </div>
</div>
