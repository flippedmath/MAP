{% extends "base.html" %}

{% block extra_css %}
<style>
    .ann-form-grid { display: grid; gap: 1rem; }
    .ann-form-grid label { display: block; font-weight: 600; margin-bottom: 5px; }
    .ann-form-grid input[type="text"],
    .ann-form-grid input[type="datetime-local"],
    .ann-form-grid textarea {
        width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;
    }
    .ann-check-row { display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; }
    .ann-check-row label { font-weight: 600; display: flex; align-items: center; gap: 0.4rem; margin: 0; }
    .ann-hint { color: #94a3b8; font-size: 0.85rem; margin: 4px 0 0; }
    .ann-badge {
        display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    }
    .ann-badge--on, .ann-badge--active { background: #dcfce7; color: #166534; }
    .ann-badge--off { background: #f1f5f9; color: #475569; }
    .ann-badge--scheduled { background: #dbeafe; color: #1d4ed8; }
    .ann-badge--expired { background: #fee2e2; color: #991b1b; }
</style>
{% endblock %}

{% block content %}
<div style="max-width: 720px; margin: 0 auto;">
    <p style="margin: 0 0 0.5rem;">
        <a href="{% url 'site_announcements_admin' %}" style="color:#2563eb;font-weight:600;text-decoration:none;">&larr; Back to announcements</a>
    </p>
    <h1 style="margin-top:0;">
        Edit announcement
        <span class="ann-badge ann-badge--{{ status }}">{{ status }}</span>
    </h1>
    <div class="card">
        <form method="post" class="ann-form-grid">
            {% csrf_token %}
            {% include "assessment_tool/components/site_announcement_form_fields.html" %}
            <div>
                <button type="submit" class="btn" style="font-weight:600;">Save changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
