{% extends "base.html" %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div class="card" style="width: 100%; max-width: 420px;">
        <h2 style="text-align: center; margin-top: 0;">Forgot password</h2>
        <p style="color: #64748b; font-size: 0.95rem; line-height: 1.45;">
            Enter the username or email for your account. If it matches an account,
            we will send a temporary reset link (valid for 15 minutes).
        </p>

        <form method="post">
            {% csrf_token %}
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Username or Email</label>
                <input type="text" name="identifier" required autofocus
                       value="{{ identifier|default:'' }}"
                       style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">
            </div>
            <button type="submit" style="width: 100%; font-weight: 600;">Send reset link</button>
        </form>

        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;">
        <p style="text-align: center; font-size: 0.9rem; color: #64748b; margin-bottom: 0;">
            <a href="{% url 'login' %}" style="color: #2563eb; font-weight: 600; text-decoration: none;">Back to sign in</a>
        </p>
    </div>
</div>
{% endblock %}
